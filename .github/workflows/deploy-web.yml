name: Deploy Zentho Web

on:
  push:
    branches:
      - main
      - cursor/zentho-finance-app-b70c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        # Optional repo secret FINNHUB_API_KEY is baked in at compile time.
        # A missing secret interpolates empty and the job still succeeds.
        run: flutter build web --release --base-href "/PersonalFinanceTracker/" --dart-define=FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}

      - name: Add .nojekyll
        run: touch build/web/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
